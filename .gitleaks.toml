title = "ContextPilot secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Verified Java source SHA-256 fingerprints in public evaluation JSON; not API credentials"
  condition = "AND"
  paths = ['''^evals/results/[^\r\n]+\.json$''']
  regexTarget = "line"
  regexes = [
    '''^\s*"src/main/java/io/github/fanqiepi/contextpilot/common/ApiErrorResponse\.java"\s*:\s*"7cd8c0535d84a9c2d7254115a2f11b1efe23d92599cbeaf8e62d7fbf92618596",?\s*$''',
    '''^\s*"src/main/java/io/github/fanqiepi/contextpilot/common/openapi/OpenApiConfiguration\.java"\s*:\s*"21f5e6c21c10edc7c6650fdb1764886cc09ac121d629df27dce7a8a95446cb60",?\s*$''',
  ]

  [[rules.allowlists]]
  description = "Verified token estimate method label, not an authentication token"
  condition = "AND"
  paths = ['''^backend/src/main/java/io/github/fanqiepi/contextpilot/readingtask/ReadingTaskService\.java$''']
  regexTarget = "line"
  regexes = [
    '''^\s*usage\.put\("calls",calls\);usage\.put\("tokenEstimateMethod","UTF8_BYTES_UPPER_BOUND"\);v\.put\("usage",usage\);\s*$''',
  ]

  [[rules.allowlists]]
  description = "Verified SHA-256 of the tracked local configuration example in reading acceptance locks; not a secret"
  condition = "AND"
  paths = ['''^evals/configs/reading/acceptance-v[0-9]+\.lock\.json$''']
  regexTarget = "line"
  regexes = [
    '''^\s*"backend/config/application-local-secrets\.example\.yml"\s*:\s*"0539a0f608e9bf50ae0a8f2a5ba73bdb032531f17a6fb2b458c08eb0c7a9e0d0",?\s*$''',
  ]
