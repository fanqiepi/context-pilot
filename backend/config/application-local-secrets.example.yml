# Copy this file to application-local-secrets.yml and fill the local credentials.
# The destination file is ignored by Git; this example must never contain real keys.
spring:
  ai:
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      api-key: ""
      chat:
        options:
          model: deepseek-v4-flash
    openai:
      api-key: ""
    vectorstore:
      type: pgvector

contextpilot:
  reading:
    # Set true to enable daily reading AI; false disables it. Restart after edits.
    ai-enabled: false
  embedding:
    index:
      profile-id: v4_eval_dashscope_qwen3_7_1024_v1
