spring:
  application:
    name: contextpilot-backend
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:21MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/context_pilot}
    username: ${DB_USERNAME:context_pilot}
    password: ${POSTGRES_PASSWORD:context_pilot_local_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ${SPRING_AI_CHAT_MODEL:none}
      embedding: ${SPRING_AI_EMBEDDING_MODEL:none}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-v4-flash
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:}
      embedding:
        options:
          model: qwen3.7-text-embedding
          dimensions: 1024
    vectorstore:
      type: ${SPRING_AI_VECTOR_STORE:none}
      pgvector:
        initialize-schema: false
        schema-validation: true
        schema-name: public
        table-name: vector_store
        id-type: UUID
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024

contextpilot:
  research:
    enabled: ${RESEARCH_ENABLED:true}
  action-request:
    confirmation-timeout-minutes: ${ACTION_CONFIRMATION_TIMEOUT_MINUTES:30}
  health:
    issue-limit: ${HEALTH_ISSUE_LIMIT:100}
  embedding:
    index:
      profile-id: ${EMBEDDING_PROFILE_ID:dashscope_qwen3_7_1024_v1}
      provider: ${EMBEDDING_PROVIDER:DASHSCOPE}
      model: ${EMBEDDING_MODEL:qwen3.7-text-embedding}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      version: ${EMBEDDING_PROFILE_VERSION:v1}
  storage:
    # Relative paths are resolved from the backend process working directory.
    root: ${STORAGE_ROOT:../data/uploads}
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
  document:
    chunking:
      max-characters: ${DOCUMENT_CHUNK_MAX_CHARACTERS:1200}
      overlap-characters: ${DOCUMENT_CHUNK_OVERLAP_CHARACTERS:150}
    processing:
      enabled: ${DOCUMENT_PROCESSING_ENABLED:false}
      core-pool-size: ${DOCUMENT_PROCESSING_CORE_POOL_SIZE:1}
      max-pool-size: ${DOCUMENT_PROCESSING_MAX_POOL_SIZE:2}
      queue-capacity: ${DOCUMENT_PROCESSING_QUEUE_CAPACITY:50}
      max-attempts: ${DOCUMENT_PROCESSING_MAX_ATTEMPTS:3}
      recovery-batch-size: ${DOCUMENT_PROCESSING_RECOVERY_BATCH_SIZE:50}
      recovery-interval-millis: ${DOCUMENT_PROCESSING_RECOVERY_INTERVAL_MILLIS:60000}
  chat:
    retrieval-top-k: ${CHAT_RETRIEVAL_TOP_K:5}
    min-similarity: ${CHAT_MIN_SIMILARITY:0.5}
    max-evidence-characters: ${CHAT_MAX_EVIDENCE_CHARACTERS:6000}
    stream-core-pool-size: ${CHAT_STREAM_CORE_POOL_SIZE:2}
    stream-max-pool-size: ${CHAT_STREAM_MAX_POOL_SIZE:8}
    stream-queue-capacity: ${CHAT_STREAM_QUEUE_CAPACITY:100}
    stream-timeout-millis: ${CHAT_STREAM_TIMEOUT_MILLIS:120000}


server:
  port: ${SERVER_PORT:18080}

logging:
  level:
    io.github.fanqiepi.contextpilot.observability.AiCallLogger: ${AI_CALL_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  type-handlers-package: io.github.fanqiepi.contextpilot.common.persistence
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: io.github.fanqiepi.contextpilot
  paths-to-match: /api/**
  swagger-ui:
    # Knife4j reads Springdoc's swagger-config endpoint to discover API groups.
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn
